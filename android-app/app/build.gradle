plugins {
    id 'com.android.application'
}

android {
    namespace 'com.twopercent.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.twopercent.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
            (details.requested.name == 'kotlin-stdlib-jdk7' ||
             details.requested.name == 'kotlin-stdlib-jdk8')) {
            details.useTarget 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
